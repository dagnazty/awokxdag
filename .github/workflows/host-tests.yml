name: Host tests

on:
  push:
    branches: [main]
    paths:
      - 'AWOKxDAG/network_parse.h'
      - 'AWOKxDAG/keyboard_layout.h'
      - 'AWOKxDAG/gps_timezone.h'
      - 'AWOKxDAG/timezone_data.h'
      - 'AWOKxDAG/AWOKxDAG.ino'
      - 'AWOKxDAG/gps.ino'
      - 'AWOKxDAG/input.ino'
      - 'AWOKxDAG/settings.ino'
      - 'AWOKxDAG/status.ino'
      - 'AWOKxDAG/screentest.ino'
      - 'AWOKxDAG/deauth.ino'
      - 'AWOKxDAG/roguewatch.ino'
      - 'AWOKxDAG/bledetect.ino'
      - 'AWOKxDAG/karmawatch.ino'
      - 'AWOKxDAG/beaconwatch.ino'
      - 'AWOKxDAG/authflood.ino'
      - 'AWOKxDAG/advancedwatch.ino'
      - 'AWOKxDAG/deauthforensics.ino'
      - 'AWOKxDAG/networktools.ino'
      - 'AWOKxDAG/upload.ino'
      - 'AWOKxDAG/wardrive_stats.h'
      - 'AWOKxDAG/file_crc.h'
      - 'AWOKxDAG/files.ino'
      - 'AWOKxDAG/link.ino'
      - 'AWOKxDAG/link_protocol.h'
      - 'AWOKxDAG/bridge_ble.ino'
      - 'AWOKxDAG/mini_display.h'
      - 'website/public/control.html'
      - 'tests/host/**'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'AWOKxDAG/network_parse.h'
      - 'AWOKxDAG/keyboard_layout.h'
      - 'AWOKxDAG/gps_timezone.h'
      - 'AWOKxDAG/timezone_data.h'
      - 'AWOKxDAG/AWOKxDAG.ino'
      - 'AWOKxDAG/gps.ino'
      - 'AWOKxDAG/input.ino'
      - 'AWOKxDAG/settings.ino'
      - 'AWOKxDAG/status.ino'
      - 'AWOKxDAG/screentest.ino'
      - 'AWOKxDAG/deauth.ino'
      - 'AWOKxDAG/roguewatch.ino'
      - 'AWOKxDAG/bledetect.ino'
      - 'AWOKxDAG/karmawatch.ino'
      - 'AWOKxDAG/beaconwatch.ino'
      - 'AWOKxDAG/authflood.ino'
      - 'AWOKxDAG/advancedwatch.ino'
      - 'AWOKxDAG/deauthforensics.ino'
      - 'AWOKxDAG/networktools.ino'
      - 'AWOKxDAG/upload.ino'
      - 'AWOKxDAG/wardrive_stats.h'
      - 'AWOKxDAG/file_crc.h'
      - 'AWOKxDAG/files.ino'
      - 'AWOKxDAG/link.ino'
      - 'AWOKxDAG/link_protocol.h'
      - 'AWOKxDAG/bridge_ble.ino'
      - 'AWOKxDAG/mini_display.h'
      - 'website/public/control.html'
      - 'tests/host/**'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parser tests (ASan/UBSan)
        run: bash tests/host/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wardrive shutdown control-flow tests (mocked radios)
        run: node --test tests/host/test_wardrive_shutdown.mjs
      - name: Phone keypad and offline timezone tests (no firmware build)
        run: node --test tests/host/test_keyboard.mjs tests/host/test_timezone.mjs
      - name: Verified file transfers and wardrive dashboard (mocked I/O, no firmware build)
        run: node --test tests/host/test_file_download.mjs tests/host/test_file_sender.mjs tests/host/test_wardrive_dashboard.mjs tests/host/test_wardrive_stats.mjs tests/host/test_files_menu.mjs tests/host/test_gps_menu.mjs tests/host/test_settings_menu.mjs tests/host/test_monitor_menu.mjs
      - name: Network menu navigation and connection states (mocked I/O, no firmware build)
        run: node --test tests/host/test_network_menu.mjs
      - name: Home navigation and shared paging/labels (mocked UI, no firmware build)
        run: node --test tests/host/test_home_menu.mjs
      - name: Recon card menu navigation and paging (mocked UI, no firmware build)
        run: node --test tests/host/test_recon_menu.mjs
